name: Test and build producer

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r producer/requirements.txt pytest
      - name: Run encryption tests
        run: python -m pytest
      - name: Build producer image
        run: docker build --tag confidential-model-producer:ci --file producer/Dockerfile .
